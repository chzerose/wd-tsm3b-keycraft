<style>

/* ============================================================
   LOGIN PAGE
   ============================================================ */

.auth-page {

  min-height: calc(100vh - 72px);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 30px 20px;

  position: relative;

  z-index: 2;

}


.auth-terminal {

  width: 100%;

  max-width: 520px;

  background: var(--panel);

  border: 2px solid var(--border-bright);

  box-shadow:
    8px 8px 0 var(--border);

}


.auth-header {

  padding: 16px 20px;

  border-bottom:
    2px solid var(--border);

  display: flex;

  justify-content: space-between;

  align-items: center;

  background: var(--bg-2);

}


.auth-status {

  color: var(--green-led);

  font-family:
    var(--font-mono);

  font-size: 11px;

}


.auth-body {

  padding: 34px;

}


.auth-title {

  font-family:
    var(--font-pixel);

  font-size: 22px;

  color: var(--cyan);

  line-height: 1.6;

  margin-bottom: 10px;

}


.auth-subtitle {

  font-family:
    var(--font-mono);

  color: var(--text-muted);

  font-size: 12px;

  margin-bottom: 30px;

}


.auth-form {

  display: flex;

  flex-direction: column;

  gap: 18px;

}


.auth-field {

  display: flex;

  flex-direction: column;

  gap: 7px;

}


.auth-field label {

  font-family:
    var(--font-mono);

  font-size: 11px;

  color: var(--purple);

}


.auth-field input {

  width: 100%;

  padding: 13px;

  background: var(--bg);

  color: var(--text);

  border: 2px solid var(--border);

  outline: none;

}


.auth-field input:focus {

  border-color: var(--cyan);

  box-shadow:
    4px 4px 0 var(--cyan-dim);

}


.auth-submit {

  margin-top: 8px;

  width: 100%;

}


.auth-error {

  display: none;

  padding: 10px 12px;

  border:
    2px solid var(--pink);

  color: var(--pink);

  background:
    rgba(255,61,138,0.05);

  font-family:
    var(--font-mono);

  font-size: 11px;

  margin-bottom: 18px;

}


.auth-error.show {

  display: block;

}


.auth-register {

  margin-top: 25px;

  padding-top: 20px;

  border-top:
    2px dashed var(--border);

  text-align: center;

}


.auth-register p {

  color: var(--text-muted);

  font-family:
    var(--font-mono);

  font-size: 11px;

  margin-bottom: 10px;

}


.auth-register a {

  color: var(--cyan);

  font-family:
    var(--font-mono);

  font-size: 12px;

}


.auth-corner {

  position: fixed;

  font-family:
    var(--font-mono);

  font-size: 10px;

  color: var(--text-dim);

  z-index: 2;

}


.auth-corner.top-left {

  top: 20px;

  left: 20px;

}


.auth-corner.bottom-right {

  right: 20px;

  bottom: 20px;

}

</style>

<meta name="description" content="Log in to KeyCraft to access your profile and keycap collection.">

<body>

  aria-hidden="true"
></div>

  aria-hidden="true"
></div>


<div class="auth-corner top-left">

  KEYCRAFT // AUTH SYSTEM

</div>


<div class="auth-corner bottom-right">

  LOCAL NODE // NO BACKEND

</div>


<header class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="logo">KEYCRAFT<span class="led" aria-hidden="true"></span></a>
    <button class="nav-burger" aria-label="Toggle menu" type="button">☰ MENU</button>
    <nav class="navlinks" aria-label="Primary">
      <a class="navlink" href="index.html">HOME</a>
      <a class="navlink" href="marketplace.html">MARKETPLACE</a>
      <a class="navlink" href="customize.html">CUSTOMIZE</a>
      <a class="navlink" href="cart.html">KEYBOARD</a>
      <a class="navlink" href="index.html#about">ABOUT</a>
    </nav>
    <div class="nav-right">
      <button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false" title="Switch to light mode"><span class="tt-knob" aria-hidden="true"></span><svg class="tt-icon tt-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg><svg class="tt-icon tt-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M5.3 18.7l1.9-1.9M16.8 7.2l1.9-1.9"/></svg></button>

      <div id="kc-user-nav"></div>
    </div>
  </div>
</header>

<main class="auth-page">

  <section class="auth-terminal">

    <header class="auth-header">

      <span class="label">
        SYSTEM ACCESS
      </span>

      <span class="auth-status">
        ● ONLINE
      </span>

    </header>


    <div class="auth-body">

      <h1 class="auth-title">
        KEYCRAFT
      </h1>


      <p class="auth-subtitle">

        // ENTER YOUR USER CREDENTIALS TO CONTINUE

      </p>


      <div
        id="login-error"
        class="auth-error"
      ></div>


      <form
        id="login-form"
        class="auth-form"
      >

        <div class="auth-field">

          <label for="username">
            USERNAME
          </label>

          <input
            type="text"
            id="username"
            autocomplete="username"
            required
          >

        </div>


        <div class="auth-field">

          <label for="password">
            PASSWORD
          </label>

          <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          class="btn btn-primary auth-submit"
        >

          [ ENTER KEYCRAFT ]

        </button>

      </form>


      <div class="auth-register">

        <p>
          NO KEYCRAFT ID DETECTED?
        </p>

        <a href="register.html">
          [ CREATE NEW USER ]
        </a>

      </div>

    </div>

  </section>

</main>


<script src="js/sounds.js"></script>
<script src="js/cart-store.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>


<script>

document.addEventListener(
  "DOMContentLoaded",
  () => {

    kcRedirectIfLoggedIn();


    const form =
      document.getElementById(
        "login-form"
      );


    const error =
      document.getElementById(
        "login-error"
      );


    form.addEventListener(
      "submit",
      (event) => {

        event.preventDefault();


        const username =
          document.getElementById(
            "username"
          ).value;


        const password =
          document.getElementById(
            "password"
          ).value;


        const result =
          kcLogin(
            username,
            password
          );


        if (!result.success) {

          error.textContent =
            "> " + result.message;

          error.classList.add(
            "show"
          );

          return;

        }


        window.location.href =
          "index.html";

      }
    );

  }
);

</script>

</body>
