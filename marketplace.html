<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace // KeyCraft</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/marketplace.css">
<meta name="description" content="Browse 12 ready-made keycap sets, filter by category, and add your favorites to your KeyCraft keyboard.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='12' fill='%2312161d' stroke='%234DE8F0' stroke-width='4'/%3E%3Crect x='16' y='14' width='32' height='28' rx='7' fill='%234DE8F0'/%3E%3Ctext x='32' y='36' font-family='monospace' font-size='20' font-weight='bold' text-anchor='middle' fill='%2312161d'%3EK%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="Marketplace // KeyCraft">
<meta property="og:description" content="Browse 12 ready-made keycap sets, filter by category, and add your favorites to your KeyCraft keyboard.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/keycap-designs.css">
<script src="js/theme.js"></script>
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-scanlines" aria-hidden="true"></div>

<header class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="logo">KEYCRAFT<span class="led" aria-hidden="true"></span></a>
    <button class="nav-burger" aria-label="Toggle menu" type="button">☰ MENU</button>
    <nav class="navlinks" aria-label="Primary">
      <a class="navlink" href="index.html">HOME</a>
      <a class="navlink active" href="marketplace.html">MARKETPLACE</a>
      <a class="navlink" href="customize.html">CUSTOMIZE</a>
      <a class="navlink" href="cart.html">KEYBOARD</a>
      <a class="navlink" href="index.html#about">ABOUT</a>
    </nav>
    <div class="nav-right"><button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false" title="Switch to light mode"><span class="tt-knob" aria-hidden="true"></span><svg class="tt-icon tt-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg><svg class="tt-icon tt-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M5.3 18.7l1.9-1.9M16.8 7.2l1.9-1.9"/></svg></button>
      <button class="sound-toggle" aria-pressed="true" type="button"><span class="dot"></span><span class="label-text">SOUND: ON</span></button>
      <a href="cart.html" class="cart-badge" id="cart-badge-target" aria-label="Cart">CART <b>00</b></a>
      <div id="kc-user-nav"></div>
    </div>
  </div>
</header>

<main class="wrap market-main">
  <div class="market-head">
    <h1 class="pixel-heading">KEYCAP INVENTORY</h1>
    <p class="label mono">// <span id="result-count">12</span> UNITS IN STOCK</p>
  </div>

  <div class="filter-bar" role="group" aria-label="Filter by category">
    <button class="filter-switch active" data-filter="ALL">ALL</button>
    <button class="filter-switch" data-filter="ART">ART</button>
    <button class="filter-switch" data-filter="MINIMAL">MINIMAL</button>
    <button class="filter-switch" data-filter="GAMING">GAMING</button>
    <button class="filter-switch" data-filter="ANIME">ANIME</button>
    <button class="filter-switch" data-filter="RETRO">RETRO</button>
    <button class="filter-switch" data-filter="NATURE">NATURE</button>
    <button class="filter-switch" data-filter="CUSTOM">CUSTOM</button>
  </div>

  <div class="sub-filter-bar">
    <label class="label" for="sort-select">SORT</label>
    <select id="sort-select" class="mono-select">
      <option value="default">DEFAULT</option>
      <option value="price-asc">PRICE ↑</option>
      <option value="price-desc">PRICE ↓</option>
      <option value="name">NAME A–Z</option>
    </select>
  </div>

  <div id="product-grid" class="product-grid" aria-live="polite"></div>
</main>

<!-- Product detail modal -->
<div id="product-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <button id="modal-close" class="btn btn-ghost modal-close" aria-label="Close">✕</button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p>KEYCRAFT LABS // INVENTORY SYSTEM v1.0</p>
    <p>ALL DATA STORED LOCALLY</p>
  </div>
</footer>

<script src="js/sounds.js"></script>
<script src="js/cart-store.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script src="js/marketplace.js"></script>
</body>
</html>
