<style>

/* ============================================================
   REGISTER PAGE
   ============================================================ */

.auth-page {

  min-height: calc(100vh - 72px);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 30px 20px;

  position: relative;

  z-index: 2;

}


.auth-terminal {

  width: 100%;

  max-width: 650px;

  background: var(--panel);

  border: 2px solid var(--border-bright);

  box-shadow:
    8px 8px 0 var(--border);

}


.auth-header {

  padding: 16px 20px;

  border-bottom:
    2px solid var(--border);

  display: flex;

  justify-content: space-between;

  background: var(--bg-2);

}


.auth-body {

  padding: 32px;

}


.auth-title {

  font-family:
    var(--font-pixel);

  font-size: 20px;

  color: var(--cyan);

  margin-bottom: 10px;

}


.auth-subtitle {

  font-family:
    var(--font-mono);

  color: var(--text-muted);

  font-size: 11px;

  margin-bottom: 28px;

}


.profile-upload {

  display: flex;

  align-items: center;

  gap: 18px;

  margin-bottom: 25px;

  padding: 15px;

  border:
    2px dashed var(--border);

  background: var(--bg-2);

}


.profile-preview {

  width: 72px;

  height: 72px;

  flex-shrink: 0;

  border:
    2px solid var(--cyan);

  background: var(--panel-raised);

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

  font-family:
    var(--font-pixel);

  color: var(--cyan);

}


.profile-preview img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}


.profile-upload label {

  font-family:
    var(--font-mono);

  font-size: 11px;

  color: var(--text-muted);

}


.profile-upload input {

  margin-top: 8px;

  color: var(--text);

  max-width: 100%;

}


.auth-form {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 17px;

}


.auth-field {

  display: flex;

  flex-direction: column;

  gap: 7px;

}


.auth-field.full {

  grid-column:
    1 / -1;

}


.auth-field label {

  font-family:
    var(--font-mono);

  font-size: 11px;

  color: var(--purple);

}


.auth-field input,
.auth-field textarea,
.auth-field select {

  width: 100%;

  padding: 12px;

  background: var(--bg);

  color: var(--text);

  border:
    2px solid var(--border);

  outline: none;

}


.auth-field textarea {

  min-height: 90px;

  resize: vertical;

}


.auth-field input:focus,
.auth-field textarea:focus,
.auth-field select:focus {

  border-color:
    var(--cyan);

}


.auth-error {

  display: none;

  margin-bottom: 18px;

  padding: 10px;

  border:
    2px solid var(--pink);

  color: var(--pink);

  font-family:
    var(--font-mono);

  font-size: 11px;

}


.auth-error.show {

  display: block;

}


.auth-submit {

  grid-column:
    1 / -1;

  width: 100%;

  margin-top: 8px;

}


.auth-login {

  grid-column:
    1 / -1;

  text-align: center;

  border-top:
    2px dashed var(--border);

  padding-top: 20px;

}


.auth-login p {

  font-family:
    var(--font-mono);

  font-size: 11px;

  color: var(--text-muted);

}


.auth-login a {

  color: var(--cyan);

}


@media (max-width: 600px) {

  .auth-form {

    grid-template-columns: 1fr;

  }

  .auth-field.full,
  .auth-submit,
  .auth-login {

    grid-column: auto;

  }

  .auth-body {

    padding: 22px;

  }

}

</style>

<body>

<main class="auth-page">

<section class="auth-terminal">


<header class="auth-header">

  <span class="label">
    NEW USER REGISTRATION
  </span>

  <span class="label">
    KEYCRAFT://CREATE
  </span>

</header>


<div class="auth-body">


<h1 class="auth-title">

  CREATE YOUR KEY ID

</h1>


<p class="auth-subtitle">

  // BUILD YOUR IDENTITY INSIDE THE KEYCRAFT LAB

</p>


<div
  id="register-error"
  class="auth-error"
></div>


<form
  id="register-form"
  class="auth-form"
>


<!-- PROFILE IMAGE -->

<div class="profile-upload auth-field full">

  <div
    id="profile-preview"
    class="profile-preview"
  >

    KC

  </div>


  <div>

    <label for="profile-photo">

      PROFILE IMAGE

    </label>


    <input
      type="file"
      id="profile-photo"
      accept="image/*"
    >

  </div>

</div>


<!-- NICKNAME -->

<div class="auth-field">

  <label for="nickname">
    NICKNAME
  </label>

  <input
    type="text"
    id="nickname"
    placeholder="Dani"
    required
  >

</div>


<!-- USERNAME -->

<div class="auth-field">

  <label for="username">
    USERNAME
  </label>

  <input
    type="text"
    id="username"
    placeholder="danielle"
    required
  >

</div>


<!-- PASSWORD -->

<div class="auth-field">

  <label for="password">
    PASSWORD
  </label>

  <input
    type="password"
    id="password"
    required
  >

</div>


<!-- CONFIRM -->

<div class="auth-field">

  <label for="confirm-password">
    CONFIRM PASSWORD
  </label>

  <input
    type="password"
    id="confirm-password"
    required
  >

</div>


<!-- BIO -->

<div class="auth-field full">

  <label for="bio">
    BIO
  </label>

  <textarea
    id="bio"
    maxlength="180"
    placeholder="Tell the lab something about you..."
  ></textarea>

</div>


<!-- SOUND -->

<div class="auth-field full">

  <label for="favorite-sound">
    FAVORITE KEY SOUND
  </label>

  <select id="favorite-sound">

    <option value="thock">
      THOCK
    </option>

    <option value="click">
      CLICK
    </option>

    <option value="clack">
      CLACK
    </option>

    <option value="pop">
      POP
    </option>

  </select>

</div>


<!-- SUBMIT -->

<button
  type="submit"
  class="btn btn-primary auth-submit"
>

  [ INITIALIZE KEYCRAFT ID ]

</button>


<!-- LOGIN -->

<div class="auth-login">

  <p>

    ALREADY HAVE A KEY ID?

    <a href="login.html">
      LOGIN →
    </a>

  </p>

</div>


</form>

</div>

</section>

</main>


<script src="js/sounds.js"></script>

<script src="js/auth.js"></script>


<script>

document.addEventListener(
  "DOMContentLoaded",
  () => {


    kcRedirectIfLoggedIn();


    const form =
      document.getElementById(
        "register-form"
      );


    const error =
      document.getElementById(
        "register-error"
      );


    const photoInput =
      document.getElementById(
        "profile-photo"
      );


    const preview =
      document.getElementById(
        "profile-preview"
      );


    let profilePhoto = "";


    /* ========================================================
       PROFILE IMAGE PREVIEW
       ======================================================== */

    photoInput.addEventListener(
      "change",
      () => {

        const file =
          photoInput.files[0];


        if (!file) return;


        const reader =
          new FileReader();


        reader.onload =
          (event) => {

            profilePhoto =
              event.target.result;


            preview.innerHTML = `

              <img
                src="${profilePhoto}"
                alt="Profile preview"
              >

            `;

          };


        reader.readAsDataURL(file);

      }
    );


    /* ========================================================
       REGISTER
       ======================================================== */

    form.addEventListener(
      "submit",
      (event) => {

        event.preventDefault();


        const nickname =
          document.getElementById(
            "nickname"
          ).value;


        const username =
          document.getElementById(
            "username"
          ).value;


        const password =
          document.getElementById(
            "password"
          ).value;


        const confirmPassword =
          document.getElementById(
            "confirm-password"
          ).value;


        const bio =
          document.getElementById(
            "bio"
          ).value;


        const favoriteSound =
          document.getElementById(
            "favorite-sound"
          ).value;


        /* PASSWORD CHECK */

        if (
          password !==
          confirmPassword
        ) {

          error.textContent =
            "> PASSWORDS DO NOT MATCH.";

          error.classList.add(
            "show"
          );

          return;

        }


        /* USERNAME CHECK */

        if (
          username.trim().length < 3
        ) {

          error.textContent =
            "> USERNAME MUST BE AT LEAST 3 CHARACTERS.";

          error.classList.add(
            "show"
          );

          return;

        }


        /* REGISTER */

        const result =
          kcRegister({

            nickname:
              nickname,

            username:
              username,

            password:
              password,

            bio:
              bio,

            favoriteSound:
              favoriteSound,

            profilePhoto:
              profilePhoto

          });


        if (!result.success) {

          error.textContent =
            "> " + result.message;

          error.classList.add(
            "show"
          );

          return;

        }


        /* SUCCESS */

        window.location.href =
          "index.html";

      }
    );

  }
);

</script>

</body>
